name: Verify research
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  scientific:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -r requirements.txt
      - name: Check bundle integrity
        run: python scripts/check_bundle.py
      - name: Reproduce symbolic and numerical evidence
        run: python scripts/reproduce.py --output-dir work/reproduction
      - name: Retain execution evidence
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6, Node.js 24
        with:
          name: scientific-evidence
          path: work/reproduction
          if-no-files-found: error
  formal:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: leanprover/lean-action@ba3fdfe5c4476c925da13bf11a005ddb47e47aee # v1
        with:
          lake-package-directory: formal
          auto-config: 'false'
          build: 'false'
          test: 'false'
          lint: 'false'
          use-mathlib-cache: 'true'
      - name: Fresh proof build, axiom audit, positive and negative controls
        run: python3 scripts/verify_lean.py --project formal --output work/lean
      - name: Retain formal execution evidence
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6, Node.js 24
        with:
          name: formal-evidence
          path: work/lean
          if-no-files-found: error
